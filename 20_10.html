<style>
:root{color-scheme:light;--bgimg:url(bg.webp);--veil:rgba(245,184,206,.74);--paper:#fffdf9;--ink:#453b36;--accent:#9b5c61;--tape:#d9c9b8;--out:#453b36;--hand:'Dancing Script','Segoe Script',cursive;--body:'Lora',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-skin=sage]{--veil:rgba(244,247,234,.66);--accent:#5f8247;--tape:#f3c9cc;--paper:#fcfbf3}
:root[data-skin=peach]{--veil:rgba(255,238,224,.64);--accent:#c0583e;--tape:#f3c9cc;--paper:#fff8ee}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
html{height:100%}body{margin:0;min-height:100%;font-family:var(--body);color:var(--out);background:transparent;overflow-x:hidden}
#backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bgimg) center/cover no-repeat}
#backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--veil),var(--veil))}
#bg-video{display:block;width:100%;height:100%;object-fit:cover;object-position:center;filter:contrast(1.04) saturate(.9)}
button,input,textarea,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hand{font-family:var(--hand);font-weight:600}
.btn{min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:#fffdf9;color:var(--accent);letter-spacing:.01em;transition:background-color .2s,border-color .2s,color .2s}
.btn.p{background:var(--accent);color:#fff}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:20px}
.env{position:relative;width:min(82vw,330px);aspect-ratio:3/2;perspective:900px;filter:drop-shadow(0 16px 18px rgba(69,59,54,.16));cursor:pointer}
.env>*{position:absolute}
.eb{inset:0;background:#c78e88;border:1px solid #a97772;border-radius:5px;z-index:0}
.el{left:7%;right:7%;top:6%;height:88%;background:var(--paper);border-radius:4px;z-index:1;color:var(--accent);font-family:var(--hand);font-weight:600;font-size:22px;padding-top:14px}
.ef{inset:0;background:#ead6c9;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:5px;z-index:2}
.fl{left:0;right:0;top:0;height:58%;background:#f3e9dd;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:3}
.seal{left:50%;top:58%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9667a,#9b2f45);color:#ffe9ec;display:grid;place-items:center;font-size:20px;z-index:4;box-shadow:0 3px 6px #0004}
#inv{margin:0;font-size:clamp(24px,6.5vw,30px);max-width:18em}
.cta{font-size:18px;padding:12px 28px;transition:transform .2s}.cta:hover{transform:translateY(-2px)}.cta:active{transform:scale(.96)}
#music-toggle{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:24;box-shadow:0 4px 12px #0003}
#skip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:25}
#eb{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;z-index:24;box-shadow:0 4px 12px #0003}
body.editing #eb{display:none}
#scene{display:none;position:relative;z-index:1;padding:30px 14px 110px}
#wrap{position:relative;max-width:560px;margin:0 auto}
.row{display:flex;justify-content:center;gap:12px;margin-bottom:-34px;position:relative;z-index:3}
.pol{position:relative;width:min(41vw,190px);margin:0;background:#fffdf9;padding:9px 9px 5px;border:1px solid #e8ddd0;box-shadow:0 7px 18px rgba(69,59,54,.12);color:#453b36}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pol figcaption{font-family:var(--hand);font-weight:600;font-size:19px;text-align:center;min-height:28px;padding-top:3px}
.pol:nth-child(odd){transform:rotate(-4deg)}.pol:nth-child(even){transform:rotate(3deg)}
.pol::before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:17px;margin-left:-27px;background:var(--tape);opacity:.7;transform:rotate(-2deg)}
.paper{position:relative;z-index:2;background-color:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(118,94,75,.018) 0,rgba(118,94,75,.018) 1px,transparent 1px,transparent 7px);color:var(--ink);padding:56px 30px 34px;border:1px solid #e9ded1;border-radius:5px;box-shadow:0 1px 0 #0001,0 14px 34px rgba(69,59,54,.14)}
.paper::before{content:"";position:absolute;inset:13px;border:1px solid rgba(155,92,97,.18);pointer-events:none}
.paper h1{margin:0 0 14px;text-align:center;color:var(--accent);font-size:clamp(30px,8.5vw,40px);line-height:1.15;overflow-wrap:anywhere}
#to{margin:0 0 10px;font-size:27px}
#msg p,#close,#ps{margin:0 0 1em;font-size:17px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere}
#ps{font-size:15px;font-style:italic;border-top:1px dashed #0003;padding-top:12px}
#sig{margin:10px 0 0;text-align:right;font-size:30px;color:var(--accent);overflow-wrap:anywhere}
#stk{position:absolute;inset:0;z-index:5;pointer-events:none}
.stk{position:absolute;margin:-.5em 0 0 -.5em;line-height:1;user-select:none;-webkit-user-select:none}
.stk-photo{line-height:0}.stk-photo-img{display:block;width:100%;height:100%;object-fit:cover;border:2px solid #fff;border-radius:12px;background:#fff;box-shadow:0 3px 8px #0003}
body.editing .stk{pointer-events:auto;cursor:grab;touch-action:none}
.stk.sel{outline:2px dashed var(--accent);outline-offset:4px;border-radius:8px}
#after{max-width:560px;margin:46px auto 0;text-align:center}
.row2{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}.row2 .pol{width:min(38vw,150px)}
#more{margin-top:34px}
#keep .pol{width:min(80vw,340px);margin:26px auto 14px;transform:none}#keep img{aspect-ratio:16/9}
#finTxt{margin:8px 0 0;font-size:clamp(24px,6.5vw,30px);line-height:1.3;overflow-wrap:anywhere}
#ed{position:fixed;z-index:30;right:0;top:0;bottom:0;width:min(390px,100%);overflow:auto;background:#fbf8f2;color:#453b36;padding:18px 18px 30px;border-left:1px solid #e4d8cb;box-shadow:0 0 28px #392d241c}
@media(max-width:760px){#ed{top:auto;height:56vh;border-radius:16px 16px 0 0}body.editing{padding-bottom:56vh}}
@media(min-width:761px){body.editing{padding-right:390px}}
#ed h2{margin:0;font-size:26px;color:var(--accent)}#ed h3{margin:22px 0 4px;font-size:15px}
.eh{display:flex;justify-content:space-between;align-items:center}
#ed label{display:block;font-size:13px;margin:12px 0 4px}
#ed input[type=text],#ed textarea,#ed select{width:100%;padding:10px 11px;border:1px solid #ded2c5;border-radius:6px;background:#fffdf9;color:#453b36}
#ed textarea{min-height:170px;resize:vertical;line-height:1.5}
.pr{display:flex;gap:8px;align-items:center;margin-top:8px}.pr img{width:44px;height:44px;object-fit:cover;border-radius:6px}.pr input[type=checkbox]{width:22px;height:22px}
.tr,.ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tr button{width:44px;height:44px;padding:2px;font-size:24px;background:#fff;border:1px solid #d9b9b9;border-radius:10px}.tr button img{display:block;width:100%;height:100%;object-fit:cover;border-radius:7px}
#ed .btn{font-size:14px;padding:8px 14px}
#msgs{font-size:13px;min-height:1.4em;margin:8px 0 0}.note{font-size:12.5px;line-height:1.5;opacity:.8}
.save-actions{display:grid;grid-template-columns:1fr 1.5fr;margin:14px 0 0;padding-top:14px;border-top:1px solid #e4d8cb}
#save-local{min-height:46px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(prefers-reduced-motion:reduce){#bg-video{display:none}}

#fx-canvas{position:fixed;inset:0;z-index:22;pointer-events:none;width:100vw;height:100vh}
.word-mask{display:inline-block;overflow:hidden;vertical-align:top;padding-top:.3em;margin-top:-.3em;padding-bottom:0.16em;margin-right:0.2em;line-height:1.15}
.word-inner{display:inline-block;will-change:transform,opacity}
.pol{transform-style:preserve-3d;will-change:transform;transition:box-shadow .35s ease}
.pol:hover{box-shadow:0 18px 32px rgba(74,47,51,.28)}
.seal{cursor:pointer;will-change:transform}
.seal:hover{transform:scale(1.08)}
.paper{will-change:transform,opacity}
.btn{will-change:transform}
#title{overflow:visible}

// ── Canvas Petal & Sparkle System ─────────────────────────────────────
const fxCanvas = $('#fx-canvas');
const fxCtx = fxCanvas ? fxCanvas.getContext('2d') : null;
let particles = [], ambientPetals = [], fxRaf = null;

function resizeFx() {
  if (!fxCanvas || !fxCtx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fxCanvas.width = window.innerWidth * dpr;
  fxCanvas.height = window.innerHeight * dpr;
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeFx);
resizeFx();

class Particle {
  constructor(x, y, color, speed, angle, size) {
    this.x = x; this.y = y; this.color = color;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size = size; this.alpha = 1;
    this.decay = 0.012 + Math.random() * 0.016;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.14;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.08; this.vx *= 0.98;
    this.rot += this.rotSpeed;
    this.alpha -= this.decay;
  }
  draw(c) {
    if (this.alpha <= 0) return;
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.rot);
    c.globalAlpha = Math.max(0, this.alpha);
    c.fillStyle = this.color;
    c.beginPath();
    c.ellipse(0, 0, this.size * 1.45, this.size * 0.72, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

class AmbientPetal {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.reset(true);
  }
  reset(randY = false) {
    this.x = Math.random() * this.w;
    this.y = randY ? Math.random() * this.h : -25;
    this.size = 4.5 + Math.random() * 5.5;
    this.speedY = 0.65 + Math.random() * 0.75;
    this.speedX = (Math.random() - 0.5) * 0.45;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.025;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.035;
    const colors = ['rgba(182,137,126,0.34)','rgba(217,190,175,0.4)','rgba(237,220,207,0.5)','rgba(203,154,151,0.32)'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.y += this.speedY;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * 1.1 + this.speedX;
    this.rot += this.rotSpeed;
    if (this.y > this.h + 25 || this.x < -30 || this.x > this.w + 30) this.reset(false);
  }
  draw(c) {
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.rot);
    c.fillStyle = this.color;
    c.beginPath();
    c.ellipse(0, 0, this.size * 1.4, this.size * 0.75, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

function spawnBurst(x, y, count = 18) {
  if (RM() || !fxCtx) return;
  const colors = ['#c6a99a', '#dfc4b6', '#b97d7a', '#eadcd1'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 6.5;
    const size = 2.5 + Math.random() * 2.5;
    const color = colors[Math.floor(Math.random() * colors.length)];
    particles.push(new Particle(x, y, color, speed, angle, size));
  }
  if (!fxRaf) loopFx();
}

function startAmbientPetals() {
  if (RM() || !fxCtx || ambientPetals.length > 0) return;
  const count = window.innerWidth < 760 ? 4 : 8;
  for (let i = 0; i < count; i++) {
    ambientPetals.push(new AmbientPetal(window.innerWidth, window.innerHeight));
  }
  if (!fxRaf) loopFx();
}

function stopAmbientPetals() {
  ambientPetals = [];
}

function loopFx() {
  if (!fxCtx) return;
  fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  for (let i = 0; i < ambientPetals.length; i++) {
    ambientPetals[i].update();
    ambientPetals[i].draw(fxCtx);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(fxCtx);
    if (particles[i].alpha <= 0) particles.splice(i, 1);
  }

  if (particles.length > 0 || ambientPetals.length > 0) {
    fxRaf = requestAnimationFrame(loopFx);
  } else {
    fxRaf = null;
  }
}

// ── Typography Mask Splitter (Vietnamese Unicode Safe) ─────────────────
function splitHeadline(el) {
  if (!el || RM()) return null;
  const raw = el.textContent.trim();
  if (!raw) return null;
  el.setAttribute('aria-label', raw);
  const words = raw.split(/\s+/);
  const esc = s => s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  el.innerHTML = words.map(w => `<span class="word-mask" aria-hidden="true"><span class="word-inner">${esc(w)}</span></span>`).join(' ');
  return el.querySelectorAll('.word-inner');
}

// ── Magnetic Buttons (Desktop) ─────────────────────────────────────────
function initMagneticButtons() {
  if (RM() || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  ['#cta', '#more', '#eb'].forEach(sel => {
    const btn = $(sel);
    if (!btn || btn.dataset.magnetized) return;
    btn.dataset.magnetized = '1';
    const xTo = gsap.quickTo(btn, 'x', { duration: 0.32, ease: 'power2.out' });
    const yTo = gsap.quickTo(btn, 'y', { duration: 0.32, ease: 'power2.out' });

    btn.addEventListener('mousemove', e => {
      const rect = btn.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      xTo(dx * 0.26);
      yTo(dy * 0.26);
    });
    btn.addEventListener('mouseleave', () => {
      xTo(0);
      yTo(0);
    });
  });
}

// ── 3D Polaroid Hover & Tilt ──────────────────────────────────────────

function animateStickerPop(el) {
  if (RM() || !el) return;
  gsap.fromTo(el,
    { scale: 0.65, rotation: '+=16' },
    { scale: 1, rotation: '-=16', duration: 0.45, ease: 'back.out(2.4)' }
  );
}

function initPolaroidTilt() {
  if (RM() || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  $$('.pol').forEach(pol => {
    if (pol.dataset.tilted) return;
    pol.dataset.tilted = '1';
    pol.addEventListener('mousemove', e => {
      const rect = pol.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      gsap.to(pol, {
        transformPerspective: 800,
        rotationY: x * 15,
        rotationX: -y * 15,
        scale: 1.035,
        duration: 0.3,
        ease: 'power1.out',
        overwrite: 'auto'
      });
    });
    pol.addEventListener('mouseleave', () => {
      const isOdd = Array.from(pol.parentNode.children).indexOf(pol) % 2 === 0;
      const naturalRot = pol.closest('#keep') ? 0 : (isOdd ? -4 : 3);
      gsap.to(pol, {
        rotationY: 0,
        rotationX: 0,
        rotation: naturalRot,
        scale: 1,
        duration: 0.5,
        ease: 'power2.out',
        overwrite: 'auto'
      });
    });
  });
}

// ── ScrollTrigger Orchestration for Letter & Gallery ──────────────────
let scrollTriggersList = [];

function initSceneScrollTriggers() {
  if (RM() || typeof ScrollTrigger === 'undefined') return;
  cleanupScrollTriggers();

  // Subtle Parallax on top polaroids
  const rowPols = $$('#row .pol');
  if (rowPols.length) {
    const stParallax = ScrollTrigger.create({
      trigger: '#scene',
      start: 'top top',
      end: 'bottom bottom',
      scrub: 1.2,
      onUpdate: self => {
        gsap.to(rowPols, { y: -self.progress * 42, overwrite: 'auto', duration: 0.25 });
      }
    });
    scrollTriggersList.push(stParallax);
  }

  // Gallery polaroids reveal gracefully as scrolled into view
  const stripPols = $$('#strip .pol');
  stripPols.forEach((pol, idx) => {
    const naturalRot = idx % 2 === 0 ? -4 : 3;
    const st = ScrollTrigger.create({
      trigger: pol,
      start: 'top 88%',
      once: true,
      onEnter: () => {
        gsap.fromTo(pol,
          { y: 35, opacity: 0, rotation: 0, scale: 0.92 },
          { y: 0, opacity: 1, rotation: naturalRot, scale: 1, duration: 0.75, ease: 'back.out(1.5)' }
        );
      }
    });
    scrollTriggersList.push(st);
  });

  // More button entrance
  const moreBtn = $('#more');
  if (moreBtn) {
    const stMore = ScrollTrigger.create({
      trigger: moreBtn,
      start: 'top 92%',
      once: true,
      onEnter: () => {
        gsap.fromTo(moreBtn,
          { y: 24, opacity: 0, scale: 0.94 },
          { y: 0, opacity: 1, scale: 1, duration: 0.65, ease: 'back.out(1.7)' }
        );
      }
    });
    scrollTriggersList.push(stMore);
  }
}

function cleanupScrollTriggers() {
  scrollTriggersList.forEach(st => st.kill());
  scrollTriggersList = [];
}

function open() {
  if (busy) return;
  playMusic();
  busy = true;
  fast = false;
  if (sealPulseTween) { sealPulseTween.kill(); sealPulseTween = null; }

  if (RM()) return showLetter(false);
  $('#skip').hidden = false;

  const sealRect = $('.seal').getBoundingClientRect();
  const burstX = sealRect.left + sealRect.width / 2;
  const burstY = sealRect.top + sealRect.height / 2;

  tl = gsap.timeline({
    defaults: { ease: 'power2.out' },

const say=t=>$('#msgs').textContent=t;
$('#ed').addEventListener('input',e=>{const t=e.target;if(t.dataset.k){S[t.dataset.k]=t.value;renderText()}else if(t.dataset.c){S.ph[t.dataset.c][1]=t.value;renderPhotos()};saveLocal();if(typeof ScrollTrigger!=='undefined')ScrollTrigger.refresh()});
$('#ed').addEventListener('change',e=>{const t=e.target;if(t.dataset.p){S.ph[t.dataset.p][0]=t.checked?1:0;renderPhotos()}else if(t.id=='skin'){S.skin=t.value;renderText()};saveLocal();if(typeof ScrollTrigger!=='undefined')ScrollTrigger.refresh()});
$('#ed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=S.st[sel],id=b.id;
if(id=='save-local'){say(saveLocal()?'Đã lưu thiệp trên trình duyệt này.':'Không lưu được — bộ nhớ trình duyệt không khả dụng.');return}
if(id=='copy-link'){const u=location.href.split('#')[0]+'#c='+enc(S);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>say('Đã sao chép link. Gửi link này cho người nhận nhé.')).catch(()=>{prompt('Sao chép link này:',u);say('Hãy sao chép link trong hộp thoại.')});return}
if(b.dataset.add){const p=ESP[S.st.length%ESP.length];S.st.push({e:b.dataset.add,x:p[0],y:p[1],s:84,r:Math.round(Math.random()*30-15)});sel=S.st.length-1;renderStk();animateStickerPop($('#stk .stk.sel'));}
else if(id=='sdel'&&s){S.st.splice(sel,1);sel=-1;renderStk()}else if(id=='sbig'&&s){s.s=Math.min(160,s.s+12);renderStk()}else if(id=='ssm'&&s){s.s=Math.max(32,s.s-12);renderStk()}else if(id=='srot'&&s){s.r=s.r>=40?-40:s.r+10;renderStk()}
else if(id=='sreset'){S.st=DEF().st;sel=-1;renderStk()}
else if(id=='ex'){edit=false;document.body.classList.remove('editing');$('#ed').hidden=true;sel=-1;renderStk()}
else if(id=='rs'){if(b.dataset.ok){S=DEF();fill();render();b.textContent='Về mặc định';delete b.dataset.ok;say('Đã đặt lại nội dung mặc định.')}else{b.dataset.ok=1;b.textContent='Bấm lần nữa để xác nhận';setTimeout(()=>{b.textContent='Về mặc định';delete b.dataset.ok},4000)}}
if(id!=='ex')saveLocal()});
document.addEventListener('keyup',e=>{if(edit&&sel>=0&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Delete','Backspace'].includes(e.key))saveLocal()});
$('#eb').onclick=()=>{tl&&tl.kill();gsap.set('.env',{clearProps:'transform,opacity'});edit=true;document.body.classList.add('editing');if($('#scene').style.display!='block')showLetter(false);fill();renderStk();$('#ed').hidden=false;$('#ed').scrollTop=0};
const h=location.hash.match(/^#c=([^&]+)/);if(h){try{S=clean(dec(h[1]));recipient=true}catch(e){}}else{const sv=loadLocal();if(sv)S=sv;}
if(recipient)$('#eb').hidden=true;
render();intro();
</script>
</body></html>
